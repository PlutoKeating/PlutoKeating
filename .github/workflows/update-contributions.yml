name: Update contribution graph

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and recolor contribution graph
        run: |
          curl -sL --max-time 60 "https://ghchart.rshah.org/PlutoKeating" -o /tmp/chart.svg
          sed -e 's/#eeeeee/#ebedf0/gi' \
              -e 's/#c6e48b/#9be9a8/gi' \
              -e 's/#7bc96f/#40c463/gi' \
              -e 's/#239a3b/#30a14e/gi' \
              -e 's/#196127/#216e39/gi' \
              /tmp/chart.svg > contribution-light.svg
          sed -e 's/#eeeeee/#161b22/gi' \
              -e 's/#c6e48b/#0e4429/gi' \
              -e 's/#7bc96f/#006d32/gi' \
              -e 's/#239a3b/#26a641/gi' \
              -e 's/#196127/#39d353/gi' \
              -e 's/#767676/#7d8590/gi' \
              /tmp/chart.svg > contribution-dark.svg

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contribution-light.svg contribution-dark.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh contribution graph"
            git push
          fi
