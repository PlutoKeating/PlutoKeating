<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{padding:20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}.sw{flex:1;min-width:70px;height:72px;border-radius:2px 14px 2px 2px;border:1.5px solid #1E1E1E;padding:8px;font:500 10px/1.3 var(--md-font-mono);display:flex;flex-direction:column;justify-content:flex-end;color:#1E1E1E}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;width:100%}</style></head><body><div class="row" style="align-items:start"><div class="md-field" style="flex:1"><label class="md-field__label">Call sign</label><input class="md-input" value="Aurora"><span class="md-field__hint">Shown on your pass.</span></div><div class="md-field md-field--error" style="flex:1"><label class="md-field__label">Gate</label><input class="md-input" value="Z99"><span class="md-field__hint">Gate not found.</span></div><div class="md-field" style="flex:1"><label class="md-field__label">Cabin</label><span class="md-select"><select><option>Supersonic</option></select><i class="ph ph-caret-down"></i></span></div></div><div class="row"><label class="md-check"><input type="checkbox" checked><span>Window</span></label><label class="md-check"><input type="checkbox"><span>Aisle</span></label><label class="md-check"><input type="radio" name="r" checked><span>Mach 1</span></label><label class="md-check"><input type="radio" name="r"><span>Mach 2</span></label><label class="md-switch"><input type="checkbox" role="switch" checked><span>Autopilot</span></label></div><div class="row"><input type="range" class="md-slider" value="62" style="--md-val:62%;max-width:320px"></div></body></html>
